name: Collect events

on:
  push:
    paths:
      - "scraper.mjs"
      - "targets.json"
      - ".github/workflows/collect.yml"
  schedule:
    - cron: "40 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Collect events
        run: node scraper.mjs

      - name: Commit updated results
        run: |
          git config user.name "lead-kit[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add events.json events.md
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "events update $(date -u +%F)"
            git push
          fi
